<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="zaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glowZa" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      
      /* 5-second master loop */
      @keyframes pulseRing {
        0%, 30% { transform: scale(0.85); opacity: 0; }
        45% { transform: scale(1.15); opacity: 0.8; }
        60%, 100% { transform: scale(1.35); opacity: 0; }
      }
      
      @keyframes successBadge {
        0%, 35% { opacity: 0; transform: translateY(10px); }
        45%, 90% { opacity: 1; transform: translateY(0); }
        95%, 100% { opacity: 0; transform: translateY(-5px); }
      }

      @keyframes legacyFail {
        0%, 20% { opacity: 0.4; }
        25%, 85% { opacity: 1; }
        90%, 100% { opacity: 0.4; }
      }

      @keyframes billCount {
        0%, 20% { opacity: 0; }
        30%, 90% { opacity: 1; }
        95%, 100% { opacity: 0; }
      }

      .pulse-circle {
        transform-origin: 660px 190px;
        animation: pulseRing 5s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }
      .success-box {
        animation: successBadge 5s infinite ease-out;
      }
      .legacy-box {
        animation: legacyFail 5s infinite ease-in-out;
      }
      .bill-alert {
        animation: billCount 5s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="420" rx="16" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect width="900" height="44" rx="16" fill="#151d2f" />
  <circle cx="28" cy="22" r="6" fill="#ef4444" />
  <circle cx="48" cy="22" r="6" fill="#f59e0b" />
  <circle cx="68" cy="22" r="6" fill="#10b981" />
  <text x="450" y="27" text-anchor="middle" fill="#9ca3af" font-size="13" font-weight="600" class="font-sans">
    Authentication Architecture: The 5-Second Difference
  </text>

  <!-- Column Splitter Line -->
  <line x1="450" y1="44" x2="450" y2="420" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- ================= LEFT COLUMN: Legacy Auth0 / SaaS ================= -->
  <g class="legacy-box">
    <rect x="35" y="65" width="380" height="330" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="55" y="85" width="130" height="24" rx="6" fill="#ef4444" fill-opacity="0.15" />
    <text x="65" y="101" fill="#ef4444" font-size="11" font-weight="700" class="font-sans">❌ LEGACY AUTH / SAAS</text>

    <!-- Password Input Box -->
    <text x="55" y="135" fill="#64748b" font-size="12" class="font-sans">Step 1: Password &amp; Salt</text>
    <rect x="55" y="145" width="340" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="70" y="168" fill="#94a3b8" font-size="13" class="font-sans">••••••••••••••••••••</text>
    <text x="350" y="168" fill="#f87171" font-size="11" class="font-sans">Weak?</text>

    <!-- Email OTP Waiting -->
    <text x="55" y="208" fill="#64748b" font-size="12" class="font-sans">Step 2: Email Magic Link / SMS OTP</text>
    <rect x="55" y="218" width="340" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="70" y="241" fill="#e2e8f0" font-size="12" class="font-sans">⏳ Waiting 45s for email deliverability...</text>

    <!-- Bill / MAU Warning Alert -->
    <g class="bill-alert">
      <rect x="55" y="272" width="340" height="100" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1.5" />
      <text x="70" y="297" fill="#fca5a5" font-size="13" font-weight="700" class="font-sans">⚠️ MAU Quota Exceeded (Auth0 / Clerk)</text>
      <text x="70" y="320" fill="#fecaca" font-size="12" class="font-sans">Active Users: 10,001 | Monthly Fee: <tspan font-weight="bold" fill="#ffffff">$350.00 / mo</tspan></text>
      <text x="70" y="342" fill="#f87171" font-size="11" class="font-sans">+ Resend/Twilio SMS costs | Vendor lock-in</text>
      <text x="70" y="360" fill="#fca5a5" font-size="11" font-style="italic" class="font-sans">Risk: Credential stuffing &amp; data breach</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: ZeroAuth ================= -->
  <g>
    <rect x="485" y="65" width="380" height="330" rx="12" fill="#061a1a" stroke="#059669" stroke-width="1.5" />
    <rect x="505" y="85" width="115" height="24" rx="6" fill="#10b981" fill-opacity="0.2" />
    <text x="515" y="101" fill="#34d399" font-size="11" font-weight="700" class="font-sans">🟢 ZEROAUTH PASSKEY</text>

    <!-- Animated Biometric Enclave Radar -->
    <circle cx="660" cy="180" r="44" fill="#042f2e" stroke="#10b981" stroke-width="1.5" />
    <circle class="pulse-circle" cx="660" cy="180" r="44" fill="none" stroke="#2dd4bf" stroke-width="2.5" />
    
    <!-- Fingerprint / Touch ID Icon -->
    <g transform="translate(642, 162) scale(1.4)" stroke="#34d399" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M12 2a10 10 0 0 0-10 10c0 3.2 1.5 6 3.8 8" />
      <path d="M12 6a6 6 0 0 0-6 6c0 1.8.8 3.5 2.1 4.6" />
      <path d="M12 10a2 2 0 0 0-2 2c0 .9.4 1.7 1 2.2" />
      <path d="M16 12a4 4 0 0 1-.8 2.4" />
      <path d="M19 12a7 7 0 0 1-1.8 4.7" />
      <path d="M22 12c0 2.5-1 4.8-2.6 6.5" />
    </g>

    <text x="660" y="248" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600" class="font-sans">
      1-Tap Hardware Cryptography
    </text>

    <!-- Success Outcome Box -->
    <g class="success-box">
      <rect x="505" y="272" width="340" height="100" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#glowZa)" />
      <text x="525" y="297" fill="#6ee7b7" font-size="14" font-weight="700" class="font-sans">⚡ Verified in 12ms (ECDSA P-256)</text>
      <text x="525" y="320" fill="#a7f3d0" font-size="12" class="font-sans">Hardware Enclave (Touch ID / Face ID / YubiKey)</text>
      <text x="525" y="342" fill="#ffffff" font-size="13" font-weight="bold" class="font-sans">Monthly Cost: $0.00 Forever (Self-Hosted)</text>
      <text x="525" y="360" fill="#34d399" font-size="11" class="font-sans">🛡️ Phishing-proof • 0 emails • Zero vendor lock-in</text>
    </g>
  </g>
</svg>
